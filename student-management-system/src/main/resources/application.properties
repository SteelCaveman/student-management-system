spring.application.name=student-management-system

# MariaDB connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studentuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studentpassword}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Actuator health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never