
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-loadtest
  namespace: student-management
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args:
            - run
            - /scripts/loadtest.js
          volumeMounts:
            - name: test-script
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: test-script
          configMap:
            name: k6-loadtest
